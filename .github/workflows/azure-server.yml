# GitHub Actions: Deploy Server to Azure App Service
name: Deploy Server to Azure

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - '.github/workflows/azure-server.yml'
  workflow_dispatch:  # Allow manual trigger

env:
  AZURE_WEBAPP_NAME: supderdesk
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create deployment package
      run: |
        # Create a clean package for deployment with just source files
        # Azure will run npm install via Oryx build system
        mkdir -p deploy-package
        cp server/package.json deploy-package/
        cp server/package-lock.json deploy-package/ 2>/dev/null || true
        cp server/index.js deploy-package/
        # CRITICAL: Include web.config for IIS WebSocket support
        cp server/web.config deploy-package/ 2>/dev/null || true
        cp server/.deployment deploy-package/ 2>/dev/null || true
        # Include TURN provider for Cloudflare TURN support
        cp server/turn-provider.js deploy-package/ 2>/dev/null || true
        cp -r server/routes deploy-package/ 2>/dev/null || true
        cp -r server/middleware deploy-package/ 2>/dev/null || true
        cp -r server/utils deploy-package/ 2>/dev/null || true
        cp -r shared deploy-package/shared 2>/dev/null || true
        cd deploy-package && zip -r ../server-package.zip .

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ./server-package.zip

    - name: Azure Logout
      run: az logout || true
      if: always()
