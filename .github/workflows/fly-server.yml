# GitHub Actions: Server CI (Render auto-deploys from GitHub)
name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - '.github/workflows/fly-server.yml'
      - 'server/render.yaml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      run: cd server && npm ci

    - name: Verify server starts
      run: |
        cd server
        npm start &
        sleep 5
        curl -f http://localhost:3001/health || exit 1
        echo "✅ Server health check passed - Render will auto-deploy from main branch"
      env:
        NODE_ENV: test
        PORT: 3001
