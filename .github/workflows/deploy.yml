# GitHub Actions Auto-Deploy Workflow
name: Deploy SuperDesk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Build and test the client
  client-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install client dependencies
      run: npm ci
    
    - name: Build client
      run: npm run build:client
      env:
        REACT_APP_SERVER_URL: ${{ secrets.REACT_APP_SERVER_URL }}
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: client-build
        path: client/build

  # Test the server
  server-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install server dependencies
      run: npm ci
    
    - name: Start server for testing
      run: |
        npm run start:server &
        sleep 5
        curl -f http://localhost:3001/health || exit 1
        curl -f http://localhost:3001/api/info || exit 1
      env:
        NODE_ENV: test
        PORT: 3001

  # Deploy notification
  deploy-status:
    runs-on: ubuntu-latest
    needs: [client-build, server-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deployment Status
      run: |
        echo "✅ SuperDesk deployment pipeline completed successfully!"
        echo "🌐 Vercel will auto-deploy the client"
        echo "🚀 Render will auto-deploy the server"
        echo "📋 Check deployment status at your dashboard"