# Render Deployment Configuration
# Place this file at the repository root or in server/ for Render to detect it.
# Render Blueprint spec: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: superdesk-server
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard (do not commit secrets):
      # - key: CLIENT_URL
      #   value: https://your-vercel-app.vercel.app
      # - key: CLOUDFLARE_TURN_KEY_ID
      #   sync: false
      # - key: CLOUDFLARE_TURN_KEY_API_TOKEN
      #   sync: false