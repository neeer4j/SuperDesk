<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperDesk Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #613da9;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            background: #fafafa;
        }

        .section h2 {
            color: #613da9;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #613da9;
        }

        button {
            padding: 12px 24px;
            background: #613da9;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            background: #4e2d8a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(97, 61, 169, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .session-id-display {
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: #613da9;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            border: 2px solid #613da9;
        }

        #join-video-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 20px;
            aspect-ratio: 16 / 9;
        }

        #join-video-container.hidden {
            display: none;
        }

        #join-remote-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #join-video-container:hover .video-controls {
            opacity: 1;
        }

        .video-controls button {
            padding: 10px 20px;
            font-size: 13px;
        }

        .status-text {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 10px;
        }

        .success {
            color: #4caf50;
            font-weight: 600;
        }

        .error {
            color: #f44336;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ SuperDesk Agent</h1>

        <!-- Host Section -->
        <div class="section">
            <h2>Host - Share Your Screen</h2>
            <div class="session-id-display" id="session-id-display">
                Waiting for session ID...
            </div>
            <div class="input-group">
                <button id="copy-session-btn" onclick="copySessionId()" disabled>
                    📋 Copy Session ID
                </button>
                <button id="start-share-btn" onclick="startScreenShare()" disabled>
                    🖥️ Start Screen Share
                </button>
            </div>
            <div class="status-text" id="host-status"></div>
        </div>

        <!-- Guest Section -->
        <div class="section">
            <h2>Guest - Connect to Session</h2>
            <div class="input-group">
                <input 
                    type="text" 
                    id="join-session-id" 
                    placeholder="Enter Session ID to connect"
                />
                <button onclick="pasteSessionId()">
                    📋 Paste
                </button>
                <button onclick="connectToSession()">
                    🔗 Connect to Session
                </button>
            </div>
            <div class="status-text" id="guest-status"></div>
        </div>

        <!-- Video Display Area -->
        <div id="join-video-container" class="hidden">
            <video id="join-remote-video" autoplay playsinline></video>
            <div class="video-controls">
                <button onclick="toggleRemoteControl()">
                    🎮 Enable Control
                </button>
                <button onclick="toggleFullscreen()">
                    ⛶ Fullscreen
                </button>
                <button onclick="endRemoteSession()">
                    ❌ End Session
                </button>
            </div>
        </div>
    </div>

    <!-- Load Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- Load SuperDesk WebRTC -->
    <script src="superdesk-webrtc.js"></script>

    <script>
        // Session management
        let currentSessionId = null;
        let isControlEnabled = false;
        let isInFullscreen = false;

        // Update session ID display when available
        window.addEventListener('session-id-ready', (event) => {
            currentSessionId = event.detail.sessionId;
            document.getElementById('session-id-display').textContent = currentSessionId;
            document.getElementById('copy-session-btn').disabled = false;
            document.getElementById('start-share-btn').disabled = false;
            updateHostStatus('Session ID ready', 'success');
        });

        // Copy session ID to clipboard
        function copySessionId() {
            if (!currentSessionId) {
                updateHostStatus('No session ID available', 'error');
                return;
            }

            // Try modern clipboard API first
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(currentSessionId)
                    .then(() => {
                        updateHostStatus('Session ID copied to clipboard!', 'success');
                    })
                    .catch(() => {
                        fallbackCopy(currentSessionId);
                    });
            } else {
                fallbackCopy(currentSessionId);
            }
        }

        // Fallback copy method
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                updateHostStatus('Session ID copied to clipboard!', 'success');
            } catch (err) {
                updateHostStatus('Failed to copy session ID', 'error');
            }
            
            document.body.removeChild(textarea);
        }

        // Paste session ID from clipboard
        function pasteSessionId() {
            // Try modern clipboard API first
            if (navigator.clipboard && navigator.clipboard.readText) {
                navigator.clipboard.readText()
                    .then(text => {
                        document.getElementById('join-session-id').value = text.trim();
                        updateGuestStatus('Session ID pasted', 'success');
                    })
                    .catch(() => {
                        updateGuestStatus('Please paste manually (Ctrl+V)', 'error');
                    });
            } else {
                updateGuestStatus('Please paste manually (Ctrl+V)', 'error');
            }
        }

        // Start screen share
        function startScreenShare() {
            updateHostStatus('Starting screen share...', '');
            
            if (typeof window.startScreenShare === 'function') {
                window.startScreenShare();
                updateHostStatus('Screen sharing started', 'success');
            } else {
                updateHostStatus('Screen share function not available', 'error');
            }
        }

        // Connect to session
        function connectToSession() {
            const sessionId = document.getElementById('join-session-id').value.trim();
            
            if (!sessionId) {
                updateGuestStatus('Please enter a session ID', 'error');
                return;
            }

            updateGuestStatus('Connecting to session...', '');
            
            if (typeof window.joinSession === 'function') {
                window.joinSession(sessionId);
                updateGuestStatus('Connected to session', 'success');
                
                // Show video container
                document.getElementById('join-video-container').classList.remove('hidden');
            } else {
                updateGuestStatus('Join session function not available', 'error');
            }
        }

        // Toggle remote control
        function toggleRemoteControl() {
            isControlEnabled = !isControlEnabled;
            
            const btn = event.target;
            if (isControlEnabled) {
                btn.textContent = '🎮 Disable Control';
                updateGuestStatus('Remote control enabled', 'success');
            } else {
                btn.textContent = '🎮 Enable Control';
                updateGuestStatus('Remote control disabled', '');
            }

            // Notify WebRTC manager about control state
            if (window.setRemoteControlEnabled) {
                window.setRemoteControlEnabled(isControlEnabled);
            }
        }

        // Toggle fullscreen
        function toggleFullscreen() {
            const container = document.getElementById('join-video-container');
            
            if (!isInFullscreen) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
                isInFullscreen = true;
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isInFullscreen = false;
            }
        }

        // End remote session
        function endRemoteSession() {
            if (confirm('Are you sure you want to end this session?')) {
                // Hide video container
                document.getElementById('join-video-container').classList.add('hidden');
                
                // Clear session ID input
                document.getElementById('join-session-id').value = '';
                
                // Reset control state
                isControlEnabled = false;
                
                updateGuestStatus('Session ended', '');
                
                // Notify WebRTC manager
                if (window.endSession) {
                    window.endSession();
                }
            }
        }

        // Update status messages
        function updateHostStatus(message, type) {
            const statusEl = document.getElementById('host-status');
            statusEl.textContent = message;
            statusEl.className = 'status-text ' + type;
        }

        function updateGuestStatus(message, type) {
            const statusEl = document.getElementById('guest-status');
            statusEl.textContent = message;
            statusEl.className = 'status-text ' + type;
        }

        // Listen for fullscreen changes
        document.addEventListener('fullscreenchange', () => {
            isInFullscreen = !!document.fullscreenElement;
        });

        // Initialize
        console.log('SuperDesk Agent UI loaded');
    </script>
</body>
</html>
