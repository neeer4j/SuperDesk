<!DOCTYPE html>
<html>

<head>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            width: 200px;
            height: 150px;
            background: #000;
            overflow: hidden;
            border-radius: 12px;
            cursor: move;
            -webkit-app-region: drag;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label {
            position: absolute;
            bottom: 4px;
            left: 4px;
            font-size: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            -webkit-app-region: no-drag;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <!-- Ultra-low latency video settings: disablePictureInPicture, low latency attributes -->
    <video id="video" autoplay playsinline muted disablePictureInPicture 
           style="pointer-events: none;"
           preload="none"></video>
    <div class="label" id="label">Camera</div>
    <div id="loading">Initializing...</div>

    <script>
        const { ipcRenderer } = require('electron');
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');

        // Listen for initialization
        ipcRenderer.on('init-overlay', async (event, data) => {
            const { type, label, mirror } = data;
            document.getElementById('label').textContent = label;

            if (mirror) {
                video.style.transform = 'scaleX(-1)';
            }

            if (type === 'local') {
                // For local camera, use getUserMedia directly
                // This is the correct approach for showing user's own camera
                try {
                    console.log('📹 Requesting camera access for local overlay...');
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { 
                            width: { ideal: 320, max: 480 },
                            height: { ideal: 240, max: 360 },
                            frameRate: { ideal: 30, min: 15 }
                        },
                        audio: false
                    });
                    
                    video.srcObject = stream;
                    await video.play();
                    loading.style.display = 'none';
                    console.log('✅ Local camera overlay initialized');
                    
                    // Monitor track for end
                    const track = stream.getVideoTracks()[0];
                    if (track) {
                        track.onended = () => {
                            console.log('📹 Local camera track ended');
                            ipcRenderer.send('close-camera-overlay', 'local');
                        };
                    }
                } catch (e) {
                    console.error('Failed to get local camera:', e);
                    loading.textContent = 'Camera error';
                    setTimeout(() => {
                        ipcRenderer.send('close-camera-overlay', 'local');
                    }, 2000);
                }
            } else if (type === 'remote') {
                // For remote camera (guest's camera shown on host)
                // Use stream-registry
                loading.textContent = 'Waiting...';
                console.log('📹 Remote overlay waiting for stream');

                try {
                    const streamRegistry = require('./stream-registry');
                    
                    let pollCount = 0;
                    const pollInterval = setInterval(() => {
                        pollCount++;

                        if (streamRegistry.hasStream('guest-camera')) {
                            const stream = streamRegistry.getStream('guest-camera');
                            if (stream && stream.getVideoTracks().length > 0) {
                                const videoTrack = stream.getVideoTracks()[0];
                                if (videoTrack.readyState === 'ended') {
                                    clearInterval(pollInterval);
                                    ipcRenderer.send('close-camera-overlay', 'remote');
                                    return;
                                }

                                video.srcObject = stream;
                                video.play().catch(e => console.error('Play error:', e));
                                loading.style.display = 'none';
                                clearInterval(pollInterval);
                                console.log('✅ Guest camera stream connected');

                                videoTrack.onended = () => {
                                    ipcRenderer.send('close-camera-overlay', 'remote');
                                };
                            }
                        }

                        if (pollCount > 100) {
                            clearInterval(pollInterval);
                            loading.textContent = 'Unavailable';
                            setTimeout(() => {
                                ipcRenderer.send('close-camera-overlay', 'remote');
                            }, 1500);
                        }
                    }, 200);
                } catch (e) {
                    console.error('Stream registry error:', e);
                    loading.textContent = 'Error';
                }
            }
        });

        // Handle window close
        window.addEventListener('beforeunload', () => {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
        });
    </script>
</body>

</html>
