<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: #2a2a32;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            height: 52px;
            width: 100%;
            -webkit-app-region: no-drag;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            background: #2a2a32;
            width: 100%;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        .toolbar-container {
            display: flex;
            align-items: center;
            gap: 0;
            background: #2a2a32;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            height: 52px;
            width: 100%;
            transition: opacity 0.2s ease;
            position: absolute;
            right: 0;
            top: 0;
            cursor: grab;
            overflow: hidden;
        }

        .toolbar-container:active {
            cursor: grabbing;
        }

        .toolbar-container.collapsed .toolbar-buttons {
            display: none;
        }

        .toggle-btn {
            width: 48px;
            height: 52px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            -webkit-app-region: no-drag;
            pointer-events: auto;
        }

        .toggle-btn:hover {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }

        .toggle-btn:active {
            transform: scale(0.95);
        }

        .toggle-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .toolbar-container.collapsed .toggle-btn svg {
            transform: rotate(180deg);
        }

        .toolbar-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px 0 0;
            flex-shrink: 0;
            margin-left: auto;
        }

        .sharing-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 8px;
            color: #10b981;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sharing-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-dot 1.5s ease infinite;
        }

        .btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            -webkit-app-region: no-drag;
            pointer-events: auto;
        }

        .btn:hover {
            background: #8b5cf6;
            color: white;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0) scale(0.95);
        }

        .btn.end {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .btn.end:hover {
            background: #ef4444;
            color: white;
        }

        .btn.active {
            background: #10b981;
            color: white;
        }

        .btn.active:hover {
            background: #059669;
        }

        .btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            pointer-events: none;
        }

        .toast {
            position: fixed;
            bottom: 70px;
            right: 20px;
            padding: 12px 20px;
            background: rgba(30, 30, 35, 0.95);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 99999;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Guest popup that appears above the user button */
        .guest-popup {
            position: fixed;
            bottom: 60px;
            right: 56px;
            background: #1e1e24;
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            white-space: nowrap;
            z-index: 99999;
        }

        .guest-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }
        
        /* File Offer Section - expands inside toolbar with smooth animation */
        /* The toolbar buttons stay fixed, this section slides in from the left */
        /* TEMPORARILY HIDDEN - uncomment display: flex to re-enable */
        .file-offer-section {
            display: none !important; /* Hidden for now */
            /* display: flex; */
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(59, 130, 246, 0.25));
            border-radius: 8px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            overflow: hidden;
            flex-shrink: 0;
            /* Start collapsed */
            width: 0;
            padding: 0;
            margin: 0;
            opacity: 0;
            /* Smooth spring-like easing for a polished feel */
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        padding 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        margin 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.3s ease-out,
                        border-color 0.3s ease;
            will-change: width, padding, margin, opacity;
        }
        
        .file-offer-section.show {
            width: 250px;
            padding: 8px 12px;
            margin-right: 10px;
            opacity: 1;
            border-color: rgba(139, 92, 246, 0.5);
        }
        
        /* Subtle glow effect when showing */
        .file-offer-section.show::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), transparent);
            border-radius: 8px;
            pointer-events: none;
        }
        
        .file-offer-icon {
            font-size: 20px;
            flex-shrink: 0;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .file-offer-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .file-offer-name {
            font-size: 12px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        
        .file-offer-size {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .file-offer-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        
        .file-offer-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-app-region: no-drag;
            transform-origin: center;
        }
        
        .file-offer-btn.accept {
            background: #10b981;
            color: white;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }
        
        .file-offer-btn.accept:hover {
            background: #059669;
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        
        .file-offer-btn.accept:active {
            transform: scale(0.95);
        }
        
        .file-offer-btn.reject {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        
        .file-offer-btn.reject:hover {
            background: #ef4444;
            color: white;
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        
        .file-offer-btn.reject:active {
            transform: scale(0.95);
        }

        .guest-popup::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: var(--arrow-left, 50%);
            transform: translateX(-50%) rotate(45deg);
            width: 12px;
            height: 12px;
            background: #1e1e24;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .guest-popup-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-buttons {
            z-index: 10;
        }

        .btn {
            z-index: 20;
        }

        .guest-popup-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #8b5cf6, #613da9);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .guest-popup-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .guest-popup-name {
            font-weight: 600;
            color: #fff;
        }

        .guest-popup-status {
            font-size: 11px;
            color: #10b981;
        }
    </style>
</head>

<body>
    <div class="toast" id="toast">Waiting for guest...</div>

    <!-- Guest info popup -->
    <div class="guest-popup" id="guestPopup">
        <div class="guest-popup-content">
            <div class="guest-popup-avatar" id="guestAvatar">G</div>
            <div class="guest-popup-info">
                <span class="guest-popup-name" id="guestName">Guest</span>
                <span class="guest-popup-status">Connected</span>
            </div>
        </div>
    </div>

    <div class="toolbar-container" id="toolbar">
        <button class="toggle-btn" id="toggleBtn" title="Hide/Show">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </button>

        <div class="toolbar-buttons">
            <!-- File Offer Section (expands when file is offered) -->
            <div class="file-offer-section" id="fileOfferSection">
                <span class="file-offer-icon">📁</span>
                <div class="file-offer-info">
                    <span class="file-offer-name" id="fileOfferName">file.txt</span>
                    <span class="file-offer-size" id="fileOfferSize">0 KB</span>
                </div>
                <div class="file-offer-buttons">
                    <button class="file-offer-btn accept" id="acceptFileBtn">✓ Accept</button>
                    <button class="file-offer-btn reject" id="rejectFileBtn">✗</button>
                </div>
            </div>
            
            <div class="sharing-badge">
                <span class="sharing-dot"></span>
                <span>SHARING</span>
            </div>

            <button class="btn" id="userBtn" title="Connected User" data-guest-name="">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </button>

            <!-- Mic Toggle Button -->
            <button class="btn" id="micBtn" title="Toggle Microphone">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                    <line x1="12" y1="19" x2="12" y2="23" />
                    <line x1="8" y1="23" x2="16" y2="23" />
                </svg>
            </button>

            <!-- Video Toggle Button -->
            <button class="btn" id="videoBtn" title="Toggle Camera">
                <svg viewBox="0 0 24 24">
                    <polygon points="23 7 16 12 23 17 23 7" />
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                </svg>
            </button>

            <button class="btn" id="fileBtn" title="Send File">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
            </button>

            <button class="btn end" id="endBtn" title="End Session">
                <svg viewBox="0 0 24 24">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                    <line x1="12" y1="2" x2="12" y2="12" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        let collapsed = false;
        let guest = null;
        let toastTimer = null;
        let popupVisible = false;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let currentEdge = 'right'; // 'top', 'right', 'bottom', 'left'
        let micActive = false;
        let videoActive = false;
        let guestIsAndroid = false;

        const toolbar = document.getElementById('toolbar');
        const toggleBtn = document.getElementById('toggleBtn');
        const userBtn = document.getElementById('userBtn');
        const micBtn = document.getElementById('micBtn');
        const videoBtn = document.getElementById('videoBtn');
        const fileBtn = document.getElementById('fileBtn');
        const endBtn = document.getElementById('endBtn');
        const toast = document.getElementById('toast');
        const guestPopup = document.getElementById('guestPopup');
        const guestAvatar = document.getElementById('guestAvatar');
        const guestName = document.getElementById('guestName');
        const fileOfferSection = document.getElementById('fileOfferSection');
        const fileOfferName = document.getElementById('fileOfferName');
        const fileOfferSize = document.getElementById('fileOfferSize');
        const acceptFileBtn = document.getElementById('acceptFileBtn');
        const rejectFileBtn = document.getElementById('rejectFileBtn');
        
        let pendingFileOffer = null;

        // Request latest guest info from main process on load
        ipcRenderer.send('toolbar-request-guest-info');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Drag functionality
        toolbar.addEventListener('mousedown', (e) => {
            // Don't drag if clicking on buttons
            if (e.target.closest('button')) return;

            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            toolbar.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - dragStartX;
            const deltaY = e.clientY - dragStartY;

            // Show visual feedback during drag
            if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
                // Notify main process that we're dragging
                ipcRenderer.send('toolbar-dragging', { x: e.screenX, y: e.screenY });
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (!isDragging) return;

            isDragging = false;
            toolbar.style.cursor = 'grab';

            // Send final position to main process for snap-to-edge
            ipcRenderer.send('toolbar-drag-end', { x: e.screenX, y: e.screenY });
        });

        function toggleGuestPopup() {
            popupVisible = !popupVisible;
            guestPopup.classList.toggle('show', popupVisible);
            console.log('[Toolbar] Guest popup toggled:', popupVisible, 'classList:', guestPopup.classList.toString());
            if (popupVisible) {
                // Wait for the next frame so the popup is rendered and measured correctly
                requestAnimationFrame(positionGuestPopup);
            }
        }

        function hideGuestPopup() {
            popupVisible = false;
            guestPopup.classList.remove('show');
        }

        function updateGuestPopup() {
            if (guest && (guest.name || guest.id)) {
                const displayName = guest.name || `ID: ${guest.id}`;
                const avatarText = (guest.name || guest.id || '?').toString().charAt(0).toUpperCase();

                guestName.textContent = displayName;
                guestAvatar.textContent = avatarText;
                userBtn.setAttribute('title', `Connected: ${displayName}`);
                userBtn.setAttribute('data-guest-name', displayName);
            } else {
                guestName.textContent = 'Waiting...';
                guestAvatar.textContent = '?';
                userBtn.setAttribute('title', 'Connected User (waiting...)');
                userBtn.setAttribute('data-guest-name', '');
            }
        }

        function positionGuestPopup() {
            // Position the popup centered above the user button
            const btnRect = userBtn.getBoundingClientRect();
            const popupRect = guestPopup.getBoundingClientRect();

            const left = Math.max(8, Math.round(btnRect.left + (btnRect.width / 2) - (popupRect.width / 2)));
            guestPopup.style.left = `${left}px`;
            guestPopup.style.right = 'auto';
            guestPopup.style.bottom = '60px';

            // position arrow so it centers below button
            const arrowOffset = Math.round(btnRect.left + (btnRect.width / 2) - left);
            guestPopup.style.setProperty('--arrow-left', `${arrowOffset}px`);

            console.log('[Toolbar] Guest popup positioned:', { left, bottom: 60, arrowOffset, btnRect, visible: popupVisible });
        }

        // TOGGLE
        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            collapsed = !collapsed;
            toolbar.classList.toggle('collapsed', collapsed);
            ipcRenderer.send('toolbar-resize', { collapsed, edge: currentEdge });
            hideGuestPopup();
            console.log('[Toolbar] Toggle clicked:', collapsed ? 'collapsed' : 'expanded', 'edge:', currentEdge);
        });

        // Listen for edge updates from main process
        ipcRenderer.on('toolbar-edge-updated', (event, { edge }) => {
            currentEdge = edge;
            console.log('[Toolbar] Edge updated to:', edge);
            if (popupVisible) positionGuestPopup();
        });

        // Ensure popup repositions on window resize
        window.addEventListener('resize', () => {
            if (popupVisible) positionGuestPopup();
        });

        // USER - toggle popup
        userBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('[Toolbar] User button clicked');
            updateGuestPopup();
            toggleGuestPopup();
        });

        // FILE - opens file picker via IPC
        fileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('[Toolbar] File button clicked');
            hideGuestPopup();
            ipcRenderer.send('toolbar-action', 'file');
        });

        // END
        endBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('[Toolbar] End button clicked');
            hideGuestPopup();
            ipcRenderer.send('toolbar-end-session');
        });

        // Listen for guest updates
        ipcRenderer.on('update-guest-info', (event, data) => {
            console.log('[Toolbar] Guest info updated:', data);
            guest = data;
            updateGuestPopup();
            if (popupVisible) positionGuestPopup();
        });

        // Hide popup when clicking outside
        document.addEventListener('click', (e) => {
            if (popupVisible && !guestPopup.contains(e.target) && !userBtn.contains(e.target)) {
                hideGuestPopup();
            }
        });

        // MIC - toggle microphone
        micBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            micActive = !micActive;
            micBtn.classList.toggle('active', micActive);
            micBtn.title = micActive ? 'Microphone On' : 'Toggle Microphone';
            console.log('[Toolbar] Mic button clicked, active:', micActive);
            hideGuestPopup();
            ipcRenderer.send('toolbar-toggle-mic', micActive);
        });

        // VIDEO - toggle camera
        videoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (guestIsAndroid) {
                showToast('Video not available with Android');
                return;
            }
            videoActive = !videoActive;
            videoBtn.classList.toggle('active', videoActive);
            videoBtn.title = videoActive ? 'Camera On' : 'Toggle Camera';
            console.log('[Toolbar] Video button clicked, active:', videoActive);
            hideGuestPopup();
            ipcRenderer.send('toolbar-toggle-video', videoActive);
        });

        // Listen for guest type updates (to disable video for Android)
        ipcRenderer.on('guest-is-android', (event, isAndroid) => {
            console.log('[Toolbar] Guest is Android:', isAndroid);
            guestIsAndroid = isAndroid;
            if (isAndroid) {
                videoBtn.classList.add('disabled');
                videoBtn.title = 'Video not available with Android';
                // If video was active, turn it off
                if (videoActive) {
                    videoActive = false;
                    videoBtn.classList.remove('active');
                    ipcRenderer.send('toolbar-toggle-video', false);
                }
            } else {
                videoBtn.classList.remove('disabled');
                videoBtn.title = 'Toggle Camera';
            }
        });

        // Listen for media state updates (sync UI when streams change)
        ipcRenderer.on('mic-state-changed', (event, isActive) => {
            micActive = isActive;
            micBtn.classList.toggle('active', micActive);
            micBtn.title = micActive ? 'Microphone On' : 'Toggle Microphone';
        });

        ipcRenderer.on('video-state-changed', (event, isActive) => {
            videoActive = isActive;
            videoBtn.classList.toggle('active', videoActive);
            videoBtn.title = videoActive ? 'Camera On' : 'Toggle Camera';
        });
        
        // ==================== FILE OFFER HANDLING ====================
        
        let fileOfferAnimating = false;
        let fileOfferVisible = false;
        
        function showFileOffer(offer) {
            // TEMPORARILY DISABLED - file offer UI is hidden
            // Just store the offer but don't expand toolbar or show UI
            pendingFileOffer = offer;
            console.log('[Toolbar] File offer received (UI disabled):', offer);
            return;
            
            /* Original code - re-enable when file offer UI is restored
            if (fileOfferAnimating || fileOfferVisible) return;
            fileOfferAnimating = true;
            fileOfferVisible = true;
            
            pendingFileOffer = offer;
            fileOfferName.textContent = offer.fileName || offer.name || 'Unknown';
            fileOfferSize.textContent = offer.fileSizeFormatted || formatFileSize(offer.fileSize || offer.size || 0);
            
            // Request toolbar window resize FIRST with expanded flag
            ipcRenderer.send('toolbar-resize', { collapsed: false, edge: currentEdge, expanded: true });
            
            // Wait a tiny bit for window resize to start, then animate content
            // This creates a smooth synchronized effect
            setTimeout(() => {
                fileOfferSection.classList.add('show');
                // Animation complete after CSS transition
                setTimeout(() => {
                    fileOfferAnimating = false;
                }, 400); // Match CSS transition duration
            }, 50);
            
            console.log('[Toolbar] Showing file offer:', offer);
            */
        }
        
        function hideFileOffer() {
            if (fileOfferAnimating || !fileOfferVisible) return;
            fileOfferAnimating = true;
            
            pendingFileOffer = null;
            
            // First animate the content out smoothly
            fileOfferSection.classList.remove('show');
            
            // Wait for content animation to complete, then resize toolbar window
            setTimeout(() => {
                ipcRenderer.send('toolbar-resize', { collapsed, edge: currentEdge, expanded: false });
                fileOfferVisible = false;
                fileOfferAnimating = false;
            }, 400); // Match CSS transition duration
            
            console.log('[Toolbar] Hiding file offer');
        }
        
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }
        
        // Accept file button
        acceptFileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('[Toolbar] Accept file clicked');
            ipcRenderer.send('toolbar-file-accept');
            hideFileOffer();
            showToast('✓ File accepted');
        });
        
        // Reject file button
        rejectFileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('[Toolbar] Reject file clicked');
            ipcRenderer.send('toolbar-file-reject');
            hideFileOffer();
            showToast('File rejected');
        });
        
        // Listen for file offers from main process
        ipcRenderer.on('show-file-offer', (event, offer) => {
            console.log('[Toolbar] Received file offer:', offer);
            showFileOffer(offer);
        });
        
        // Listen for file offer cancellation
        ipcRenderer.on('hide-file-offer', () => {
            console.log('[Toolbar] File offer cancelled');
            hideFileOffer();
        });

        console.log('[Toolbar] Initialized successfully');
    </script>
</body>

</html>
