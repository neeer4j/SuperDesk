<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background: #2a2a32;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            height: 52px;
            width: 100%;
            -webkit-app-region: no-drag;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            background: #2a2a32;
            width: 100%;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        .toolbar-container {
            display: flex;
            align-items: center;
            gap: 0;
            background: #2a2a32;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            height: 52px;
            width: 100%;
            transition: opacity 0.2s ease;
            position: absolute;
            right: 0;
            top: 0;
        }

        .toolbar-container.collapsed .toolbar-buttons {
            display: none;
        }

        .toggle-btn {
            width: 48px;
            height: 52px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            -webkit-app-region: no-drag;
            pointer-events: auto;
        }

        .toggle-btn:hover {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }

        .toggle-btn:active {
            transform: scale(0.95);
        }

        .toggle-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .toolbar-container.collapsed .toggle-btn svg {
            transform: rotate(180deg);
        }

        .toolbar-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px 0 0;
        }

        .sharing-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 8px;
            color: #10b981;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sharing-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-dot 1.5s ease infinite;
        }

        .btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            -webkit-app-region: no-drag;
            pointer-events: auto;
        }

        .btn:hover {
            background: #8b5cf6;
            color: white;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0) scale(0.95);
        }

        .btn.end {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .btn.end:hover {
            background: #ef4444;
            color: white;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            pointer-events: none;
        }

        .toast {
            position: fixed;
            bottom: 70px;
            right: 20px;
            padding: 12px 20px;
            background: rgba(30, 30, 35, 0.95);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 99999;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Guest popup that appears above the user button */
        .guest-popup {
            position: absolute;
            bottom: 56px;
            right: 200px;
            background: #1e1e24;
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            white-space: nowrap;
            z-index: 100;
        }

        .guest-popup.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .guest-popup::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 16px;
            width: 12px;
            height: 12px;
            background: #1e1e24;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transform: rotate(45deg);
        }

        .guest-popup-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .guest-popup-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #8b5cf6, #613da9);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .guest-popup-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .guest-popup-name {
            font-weight: 600;
            color: #fff;
        }

        .guest-popup-status {
            font-size: 11px;
            color: #10b981;
        }
    </style>
</head>

<body>
    <div class="toast" id="toast">Waiting for guest...</div>

    <!-- Guest info popup -->
    <div class="guest-popup" id="guestPopup">
        <div class="guest-popup-content">
            <div class="guest-popup-avatar" id="guestAvatar">G</div>
            <div class="guest-popup-info">
                <span class="guest-popup-name" id="guestName">Guest</span>
                <span class="guest-popup-status">Connected</span>
            </div>
        </div>
    </div>

    <div class="toolbar-container" id="toolbar">
        <button class="toggle-btn" id="toggleBtn" title="Hide/Show">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </button>

        <div class="toolbar-buttons">
            <div class="sharing-badge">
                <span class="sharing-dot"></span>
                <span>SHARING</span>
            </div>

            <button class="btn" id="userBtn" title="Connected User">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </button>

            <button class="btn" id="fileBtn" title="Send File">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
            </button>

            <button class="btn end" id="endBtn" title="End Session">
                <svg viewBox="0 0 24 24">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                    <line x1="12" y1="2" x2="12" y2="12" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        let collapsed = false;
        let guest = null;
        let toastTimer = null;
        let popupVisible = false;

        const toolbar = document.getElementById('toolbar');
        const toggleBtn = document.getElementById('toggleBtn');
        const userBtn = document.getElementById('userBtn');
        const fileBtn = document.getElementById('fileBtn');
        const endBtn = document.getElementById('endBtn');
        const toast = document.getElementById('toast');
        const guestPopup = document.getElementById('guestPopup');
        const guestAvatar = document.getElementById('guestAvatar');
        const guestName = document.getElementById('guestName');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function toggleGuestPopup() {
            popupVisible = !popupVisible;
            guestPopup.classList.toggle('show', popupVisible);
        }

        function hideGuestPopup() {
            popupVisible = false;
            guestPopup.classList.remove('show');
        }

        function updateGuestPopup() {
            if (guest && guest.name) {
                guestName.textContent = guest.name;
                guestAvatar.textContent = guest.name.charAt(0).toUpperCase();
            } else {
                guestName.textContent = 'Waiting...';
                guestAvatar.textContent = '?';
            }
        }

        // TOGGLE
        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            collapsed = !collapsed;
            toolbar.classList.toggle('collapsed', collapsed);
            ipcRenderer.send('toolbar-resize', { collapsed });
            hideGuestPopup();
            console.log('[Toolbar] Toggle clicked:', collapsed ? 'collapsed' : 'expanded');
        });

        // USER - toggle popup
        userBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('[Toolbar] User button clicked');
            updateGuestPopup();
            toggleGuestPopup();
        });

        // FILE - opens file picker via IPC
        fileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('[Toolbar] File button clicked');
            hideGuestPopup();
            ipcRenderer.send('toolbar-action', 'file');
        });

        // END
        endBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            console.log('[Toolbar] End button clicked');
            hideGuestPopup();
            ipcRenderer.send('toolbar-end-session');
        });

        // Listen for guest updates
        ipcRenderer.on('update-guest-info', (event, data) => {
            console.log('[Toolbar] Guest info updated:', data);
            guest = data;
            updateGuestPopup();
        });

        // Hide popup when clicking outside
        document.addEventListener('click', (e) => {
            if (popupVisible && !guestPopup.contains(e.target) && !userBtn.contains(e.target)) {
                hideGuestPopup();
            }
        });

        console.log('[Toolbar] Initialized successfully');
    </script>
</body>

</html>
